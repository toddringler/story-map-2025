<!DOCTYPE html>
<html>

<head>
    <meta charset='utf-8' />
    <title>Mapbox Storytelling</title>
    <meta name='viewport' content='initial-scale=1,maximum-scale=1,user-scalable=no' />
    <link rel="icon" type="image/x-icon"
        href="https://raw.githubusercontent.com/mapbox/assembly/publisher-staging/src/svgs/mapbox.svg">
    <script src='https://api.tiles.mapbox.com/mapbox-gl-js/v3.8.0/mapbox-gl.js'></script>
    <link href='https://api.tiles.mapbox.com/mapbox-gl-js/v3.8.0/mapbox-gl.css' rel='stylesheet' />
    <script src="https://cdn.jsdelivr.net/npm/mapbox-gl-globe-minimap@1.2.0/dist/bundle.js"></script>
    <script src="https://unpkg.com/scrollama"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: sans-serif;
        }

        a,
        a:hover,
        a:visited {
            color: #0071bc;
        }

        #map {
            top: 0;
            height: 100vh;
            width: 100vw;
            position: fixed;
        }

        #header {
            margin: auto;
            width: 100%;
            position: relative;
            z-index: 5;
        }

        #header h1,
        #header h2,
        #header p {
            margin: 0;
            padding: 0.75vh 2vw;
            text-align: center;
        }

        #footer {
            width: 100%;
            min-height: 5vh;
            padding-top: 2vh;
            padding-bottom: 2vh;
            text-align: center;
            line-height: 25px;
            font-size: 18px;
            position: relative;
            z-index: 5;
        }

        #features {
            padding-top: 10vh;
            padding-bottom: 10vh;
        }

        .hidden {
            visibility: hidden;
        }

        .centered {
            width: 50vw;
            margin: 0 auto;
        }

        .lefty {
            width: 40vw;
            margin-left: 5vw;
        }

        .righty {
            width: 45vw;
            margin-left: 52vw;
        }

        .fully {
            width: 100%;
            margin: auto;
        }

        .light {
            color: #444;
            background-color: #fafafa;
        }

        .dark {
            color: #fafafa;
            background-color: #444;
        }

        .step {
            padding-bottom: 50vh;
            /* margin-bottom: 10vh; */
            opacity: 0.25;
        }

        .step.active {
            opacity: 0.95;
        }

        .step div {
            padding: 1px 20px;
            line-height: 25px;
            font-size: 18px;
        }

        .step img {
            width: 100%;
        }

        @media (max-width: 750px) {

            .centered,
            .lefty,
            .righty,
            .fully {
                width: 90vw;
                margin: 0 auto;
            }
        }

        /* Fix issue on mobile browser where scroll breaks  */
        .mapboxgl-canvas-container.mapboxgl-touch-zoom-rotate.mapboxgl-touch-drag-pan,
        .mapboxgl-canvas-container.mapboxgl-touch-zoom-rotate.mapboxgl-touch-drag-pan .mapboxgl-canvas {
            touch-action: unset;
        }
    </style>
</head>

<body>

    <div id="map"></div>
    <div id="story"></div>

    <script src="./mapbox-token.js"></script>
    <script src="./config.js"></script>
    <script>
        var initLoad = true;
        var layerTypes = {
            'fill': ['fill-opacity'],
            'line': ['line-opacity'],
            'circle': ['circle-opacity', 'circle-stroke-opacity'],
            'symbol': ['icon-opacity', 'text-opacity'],
            'raster': ['raster-opacity'],
            'fill-extrusion': ['fill-extrusion-opacity'],
            'heatmap': ['heatmap-opacity']
        }

        var alignments = {
            'left': 'lefty',
            'center': 'centered',
            'right': 'righty',
            'full': 'fully'
        }

        function getLayerPaintType(layer) {
            var layerType = map.getLayer(layer).type;
            return layerTypes[layerType];
        }

        function setLayerOpacity(layer) {
            var paintProps = getLayerPaintType(layer.layer);
            paintProps.forEach(function (prop) {
                var options = {};
                if (layer.duration) {
                    var transitionProp = prop + "-transition";
                    options = { "duration": layer.duration };
                    map.setPaintProperty(layer.layer, transitionProp, options);
                }
                map.setPaintProperty(layer.layer, prop, layer.opacity, options);
            });
        }

        var story = document.getElementById('story');
        var features = document.createElement('div');
        features.setAttribute('id', 'features');

        var header = document.createElement('div');

        if (config.title) {
            var titleText = document.createElement('h1');
            titleText.innerText = config.title;
            header.appendChild(titleText);
        }

        if (config.subtitle) {
            var subtitleText = document.createElement('h2');
            subtitleText.innerText = config.subtitle;
            header.appendChild(subtitleText);
        }

        if (config.byline) {
            var bylineText = document.createElement('p');
            bylineText.innerText = config.byline;
            header.appendChild(bylineText);
        }

        if (header.innerText.length > 0) {
            header.classList.add(config.theme);
            header.setAttribute('id', 'header');
            story.appendChild(header);
        }

        config.chapters.forEach((record, idx) => {
            var container = document.createElement('div');
            var chapter = document.createElement('div');

            if (record.title) {
                var title = document.createElement('h3');
                title.innerText = record.title;
                chapter.appendChild(title);
            }

            if (record.image) {
                var image = new Image();
                image.src = record.image;
                chapter.appendChild(image);
            }

            if (record.description) {
                var story = document.createElement('p');
                story.innerHTML = record.description;
                chapter.appendChild(story);
            }

            container.setAttribute('id', record.id);
            container.classList.add('step');
            if (idx === 0) {
                container.classList.add('active');
            }

            chapter.classList.add(config.theme);
            container.appendChild(chapter);
            container.classList.add(alignments[record.alignment] || 'centered');
            if (record.hidden) {
                container.classList.add('hidden');
            }
            features.appendChild(container);
        });

        story.appendChild(features);

        var footer = document.createElement('div');

        if (config.footer) {
            var footerText = document.createElement('p');
            footerText.innerHTML = config.footer;
            footer.appendChild(footerText);
        }

        if (footer.innerText.length > 0) {
            footer.classList.add(config.theme);
            footer.setAttribute('id', 'footer');
            story.appendChild(footer);
        }

        mapboxgl.accessToken = config.accessToken;

        var map = new mapboxgl.Map({
            container: 'map',
            style: config.style,
            center: config.chapters[0].location.center,
            zoom: config.chapters[0].location.zoom,
            bearing: config.chapters[0].location.bearing,
            pitch: config.chapters[0].location.pitch,
            interactive: false,
            projection: config.projection
        });

        // Create a inset map if enabled in config.js
        if (config.inset) {
            map.addControl(
                new GlobeMinimap({ ...config.insetOptions }),
                config.insetPosition
            );
        }

        if (config.showMarkers) {
            var marker = new mapboxgl.Marker({ color: config.markerColor });
            marker.setLngLat(config.chapters[0].location.center).addTo(map);
        }

        // instantiate the scrollama
        var scroller = scrollama();


        map.on("load", function () {
            if (config.use3dTerrain) {
                map.addSource('mapbox-dem', {
                    'type': 'raster-dem',
                    'url': 'mapbox://mapbox.terrain-rgb',
                    'tileSize': 512,
                    'maxzoom': 14
                });
                // add the DEM source as a terrain layer with exaggerated height
                map.setTerrain({ 'source': 'mapbox-dem', 'exaggeration': 1.5 });

                // add a sky layer that will show when the map is highly pitched
                map.addLayer({
                    'id': 'sky',
                    'type': 'sky',
                    'paint': {
                        'sky-type': 'atmosphere',
                        'sky-atmosphere-sun': [0.0, 0.0],
                        'sky-atmosphere-sun-intensity': 1
                    }
                });

                // Add vector tileset as a source
                map.addSource('track', {
                    type: 'vector',
                    url: 'mapbox://taco-overlander.7t7s89oa'
                });

                // Add a line layer using the tileset
                map.addLayer({
                    id: 'track-layer',
                    type: 'line',
                    source: 'track',
                    'source-layer': 'full-track-2025-6jngjb',
                    layout: {
                    'line-join': 'round',
                    'line-cap': 'round'
                    },
                    paint: {
                    'line-color': '#FF0000',
                    'line-width': 4
                    }
                });
            };

            // setup the instance, pass callback functions
            scroller
                .setup({
                    step: '.step',
                    offset: 0.5,
                    progress: true
                })
                .onStepEnter(async response => {
                    var current_chapter = config.chapters.findIndex(chap => chap.id === response.element.id);
                    var chapter = config.chapters[current_chapter];

                    response.element.classList.add('active');
                    map[chapter.mapAnimation || 'flyTo'](chapter.location);

                    if (config.showMarkers) {
                        if (chapter.showMarker !== false) {
                            marker.setLngLat(chapter.location.center);
                            marker.addTo(map);
                        } else {
                            marker.remove();
                        }
                    }
                    if (chapter.onChapterEnter.length > 0) {
                        chapter.onChapterEnter.forEach(setLayerOpacity);
                    }
                    if (chapter.callback) {
                        window[chapter.callback]();
                    }
                    if (chapter.rotateAnimation) {
                        map.once('moveend', () => {
                            const rotateNumber = map.getBearing();
                            map.rotateTo(rotateNumber + 180, {
                                duration: 30000, easing: function (t) {
                                    return t;
                                }
                            });
                        });
                    }
                    if (config.auto) {
                        var next_chapter = (current_chapter + 1) % config.chapters.length;
                        map.once('moveend', () => {
                            document.querySelectorAll('[data-scrollama-index="' + next_chapter.toString() + '"]')[0].scrollIntoView();
                        });
                    }
                })
                .onStepExit(response => {
                    var chapter = config.chapters.find(chap => chap.id === response.element.id);
                    response.element.classList.remove('active');
                    if (chapter.onChapterExit.length > 0) {
                        chapter.onChapterExit.forEach(setLayerOpacity);
                    }
                });


            if (config.auto) {
                document.querySelectorAll('[data-scrollama-index="0"]')[0].scrollIntoView();
            }
        });    

        // ============================================
        // REGIONS MANAGEMENT SYSTEM
        // ============================================
        // Define all regions with their markers and bounding boxes
        var regionsData = {
            'olympic': {
                markers: [
                    { coords: [-123.75, 47.4889], title: 'Colonel Bob Peak', color: '#FF6B6B' },
                    { coords: [-124.37, 47.61], title: 'Tide Pooling', color: '#4ECDC4' },
                    { coords: [-123.498, 47.969], title: 'Hurricane Ridge', color: '#95E1D3' }
                ],
                box: [
                    [-124.8, 48.45],  // Northwest
                    [-123.0, 48.15],  // Northeast
                    [-123.0, 47.2],   // Southeast
                    [-124.7, 47.2],   // Southwest
                    [-124.8, 48.45]   // Close the loop
                ]
            },
            'vancouver-island': {
                markers: [
                    { coords: [-125.9, 49.65], title: 'Tofino', color: '#FF6B6B' },
                    { coords: [-124.8, 49.68], title: 'Cathedral Grove', color: '#4ECDC4' },
                    { coords: [-125.2, 50.03], title: 'Telegraph Cove', color: '#95E1D3' }
                ],
                box: [
                    [-128.9353358, 51.0238562],  // Northwest tip
                    [-127.9824193, 49.7596638],  // Northeast
                    [-125.5743737, 48.7426411],  // East
                    [-123.6427863, 48.2391256],  // Southeast
                    [-122.8959058, 48.3333807],  // South (Victoria area)
                    [-122.9989238, 48.9206527],  // Southwest
                    [-124.402544, 49.7679817],   // West
                    [-125.4352484, 50.5601736],  // Northwest
                    [-127.3349146, 51.0756819],  // North
                    [-128.3038718, 51.2036706],  // North
                    [-128.6991044, 51.1637122],  // Northwest
                    [-128.9353358, 51.0238562]   // Close the loop
                ]
            },
            'inner-passage-ferry': {
                markers: [
                    { coords: [-133.0, 56.5], title: 'Location 1', color: '#FF6B6B' },
                    { coords: [-132.5, 57.0], title: 'Location 2', color: '#4ECDC4' },
                    { coords: [-133.5, 57.5], title: 'Location 3', color: '#95E1D3' }
                ],
                box: [
                    [-133.0, 53.0],   // Northwest
                    [-131.5, 53.0],   // Northeast
                    [-131.5, 51.0],   // Southeast
                    [-133.0, 51.0],   // Southwest
                    [-133.0, 53.0]    // Close the loop
                ]
            },
            'stewart-cassiar': {
                markers: [
                    { coords: [-129.5, 58.5], title: 'Location 1', color: '#FF6B6B' },
                    { coords: [-130.0, 59.0], title: 'Location 2', color: '#4ECDC4' },
                    { coords: [-129.0, 59.5], title: 'Location 3', color: '#95E1D3' }
                ],
                box: [
                    [-131.0, 60.5],   // Northwest
                    [-128.0, 60.5],   // Northeast
                    [-128.0, 57.5],   // Southeast
                    [-131.0, 57.5],   // Southwest
                    [-131.0, 60.5]    // Close the loop
                ]
            },
            'yukon-haines': {
                markers: [
                    { coords: [-135.5, 60.0], title: 'Location 1', color: '#FF6B6B' },
                    { coords: [-136.0, 60.5], title: 'Location 2', color: '#4ECDC4' },
                    { coords: [-137.0, 59.5], title: 'Location 3', color: '#95E1D3' }
                ],
                box: [
                    [-138.0, 61.0],   // Northwest
                    [-135.0, 61.0],   // Northeast
                    [-135.0, 59.0],   // Southeast
                    [-138.0, 59.0],   // Southwest
                    [-138.0, 61.0]    // Close the loop
                ]
            },
            'wrangell-st-elias': {
                markers: [
                    { coords: [-142.5, 61.5], title: 'Location 1', color: '#FF6B6B' },
                    { coords: [-143.0, 61.0], title: 'Location 2', color: '#4ECDC4' },
                    { coords: [-144.0, 61.8], title: 'Location 3', color: '#95E1D3' }
                ],
                box: [
                    [-145.0, 62.5],   // Northwest
                    [-141.5, 62.5],   // Northeast
                    [-141.5, 60.5],   // Southeast
                    [-145.0, 60.5],   // Southwest
                    [-145.0, 62.5]    // Close the loop
                ]
            },
            'dempster-highway': {
                markers: [
                    { coords: [-137.0, 65.0], title: 'Location 1', color: '#FF6B6B' },
                    { coords: [-136.5, 66.5], title: 'Location 2', color: '#4ECDC4' },
                    { coords: [-138.0, 67.5], title: 'Location 3', color: '#95E1D3' }
                ],
                box: [
                    [-139.0, 68.5],   // Northwest
                    [-135.5, 68.5],   // Northeast
                    [-135.5, 64.0],   // Southeast
                    [-139.0, 64.0],   // Southwest
                    [-139.0, 68.5]    // Close the loop
                ]
            }
        };

        // Track active markers
        var activeMarkers = [];

        // Generic function to show a region
        function showRegion(regionId) {
            // First, hide all regions to ensure clean state
            hideAllRegions();
            
            // Get region data
            var region = regionsData[regionId];
            if (!region) {
                console.warn('Region not found:', regionId);
                return;
            }
            
            // Create markers
            region.markers.forEach(function(loc) {
                var popup = new mapboxgl.Popup({ offset: 25, closeButton: false, closeOnClick: false })
                    .setText(loc.title);
                    
                var marker = new mapboxgl.Marker({ color: loc.color })
                    .setLngLat(loc.coords)
                    .setPopup(popup)
                    .addTo(map)
                    .togglePopup();
                    
                activeMarkers.push(marker);
            });
            
            // Show bounding box
            showRegionBox(regionId, region.box);
        }

        // Generic function to show a region's bounding box
        function showRegionBox(regionId, boxCoords) {
            var layerId = regionId + '-box-layer';
            var sourceId = regionId + '-box';
            
            // Remove if exists
            if (map.getLayer(layerId)) {
                map.removeLayer(layerId);
            }
            if (map.getSource(sourceId)) {
                map.removeSource(sourceId);
            }
            
            // Add source
            map.addSource(sourceId, {
                'type': 'geojson',
                'data': {
                    'type': 'Feature',
                    'geometry': {
                        'type': 'Polygon',
                        'coordinates': [boxCoords]
                    }
                }
            });
            
            // Add layer
            map.addLayer({
                'id': layerId,
                'type': 'line',
                'source': sourceId,
                'layout': {},
                'paint': {
                    'line-color': '#000000',
                    'line-width': 3
                }
            });
        }

        // Hide all regions
        function hideAllRegions() {
            // Remove all markers
            activeMarkers.forEach(m => m.remove());
            activeMarkers = [];
            
            // Remove all boxes
            Object.keys(regionsData).forEach(function(regionId) {
                var layerId = regionId + '-box-layer';
                var sourceId = regionId + '-box';
                
                if (map.getLayer(layerId)) {
                    map.removeLayer(layerId);
                }
                if (map.getSource(sourceId)) {
                    map.removeSource(sourceId);
                }
            });
        }

        // Backward compatibility functions (keep old function names working)
        function showOlympicMarkers() { showRegion('olympic'); }
        function showVancouverIslandMarkers() { showRegion('vancouver-island'); }
        function hideAllRegionMarkers() { hideAllRegions(); }
        
        // Wrapper functions for new regions
        function showInnerPassageFerry() { showRegion('inner-passage-ferry'); }
        function showStewartCassiar() { showRegion('stewart-cassiar'); }
        function showYukonHaines() { showRegion('yukon-haines'); }
        function showWrangellStElias() { showRegion('wrangell-st-elias'); }
        function showDempsterHighway() { showRegion('dempster-highway'); }

    </script>

</body>

</html>
